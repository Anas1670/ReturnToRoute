AWSTemplateFormatVersion: '2010-09-09'
Description: Return-to-Route ephemeral demo - EC2, private RDS PostgreSQL
Parameters:
  VpcId: {Type: AWS::EC2::VPC::Id}
  PublicSubnetId: {Type: AWS::EC2::Subnet::Id}
  DbSubnetA: {Type: AWS::EC2::Subnet::Id}
  DbSubnetB: {Type: AWS::EC2::Subnet::Id}
  AppZipUrl: {Type: String, NoEcho: true}
  DbPassword: {Type: String, NoEcho: true, MinLength: 12}
  AppSecret: {Type: String, NoEcho: true, MinLength: 32}
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Return-to-Route web HTTP
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  DbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from web EC2
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WebSG
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RTR database subnets
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      DBName: return_to_route
      MasterUsername: rtr_admin
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSG]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
    DeletionPolicy: Delete
  Web:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: t3.micro
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId: !Ref PublicSubnetId
          GroupSet: [!Ref WebSG]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > >(tee /var/log/rtr-install.log | logger -t rtr-init -s 2>/dev/console) 2>&1
          set -euo pipefail
          umask 077
          echo 'Installing Return-to-Route application'
          dnf install -y python3.11 python3.11-pip nginx postgresql15 unzip
          mkdir -p /opt/rtr
          curl --fail --location --retry 8 --retry-delay 5 '${AppZipUrl}' -o /tmp/rtr.zip
          unzip -q /tmp/rtr.zip -d /opt/rtr
          python3.11 -m venv /opt/rtr/venv
          /opt/rtr/venv/bin/pip install --upgrade pip
          /opt/rtr/venv/bin/pip install -r /opt/rtr/requirements-deploy.txt
          cat > /etc/rtr.env <<'ENVFILE'
          DB_NAME=return_to_route
          DB_USER=rtr_admin
          DB_HOST=${Database.Endpoint.Address}
          DB_PORT=5432
          DB_PASSWORD=${DbPassword}
          SECRET_KEY=${AppSecret}
          ENVFILE
          chmod 600 /etc/rtr.env
          export PGPASSWORD='${DbPassword}'
          for i in $(seq 1 120); do
            if pg_isready -h '${Database.Endpoint.Address}' -U rtr_admin -d return_to_route; then break; fi
            sleep 5
          done
          psql -v ON_ERROR_STOP=1 -h '${Database.Endpoint.Address}' -U rtr_admin -d return_to_route -f /opt/rtr/bootstrap/schema.sql
          psql -v ON_ERROR_STOP=1 -h '${Database.Endpoint.Address}' -U rtr_admin -d return_to_route -f /opt/rtr/bootstrap/products.sql
          cat > /etc/systemd/system/rtr.service <<'SERVICE'
          [Unit]
          Description=Return-to-Route Gunicorn
          After=network-online.target
          [Service]
          Type=simple
          WorkingDirectory=/opt/rtr
          EnvironmentFile=/etc/rtr.env
          ExecStart=/opt/rtr/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 'app:create_app()'
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          SERVICE
          cat > /etc/nginx/nginx.conf <<'NGINX'
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;
          events { worker_connections 1024; }
          http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            access_log /var/log/nginx/access.log;
            sendfile on;
            server {
              listen 80 default_server;
              server_name _;
              client_max_body_size 4m;
              location / {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
          }
          NGINX
          nginx -t
          systemctl daemon-reload
          systemctl enable --now rtr nginx
          echo 'Return-to-Route setup finished'
Outputs:
  Website:
    Value: !Sub 'http://${Web.PublicIp}'
  PublicIp:
    Value: !GetAtt Web.PublicIp
